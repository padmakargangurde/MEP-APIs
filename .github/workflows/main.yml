
name: Deploy .NET 8 REST API to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CONTAINER_NAME: MEP-APIs
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest

    steps:
      # 1. Download the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Create a lowercase image name
      - name: Set Docker image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 3. Authenticate with GitHub Container Registry
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build and publish the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # 5. Connect to EC2 and deploy the image
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          EC2_APP_PORT: ${{ secrets.EC2_APP_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,EC2_APP_PORT
          script: |
            set -eu

            # Log in to the container registry
            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            # Download the latest image
            docker pull "$IMAGE_NAME:latest"

            # Replace the old API container
            docker rm -f rmeprestapi 2>/dev/null || true

            # Start the new API container
            docker run -d \
              --name rmeprestapi \
              --restart unless-stopped \
              -p "${EC2_APP_PORT}:8080" \
              "$IMAGE_NAME:latest"

            # Display deployment status
            docker ps --filter "name=rmeprestapi"
            docker logs --tail 50 rmeprestapi

            # Log out from the registry
            docker logout ghcr.io
