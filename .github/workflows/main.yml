name: Build and Deploy .NET 8 Web API

on:
  push:
    branches:
      - main

  # Allow manual deployment from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mep-apis-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authenticate with Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mep-apis:latest
            ${{ secrets.DOCKER_USERNAME }}/mep-apis:${{ github.sha }}

      # 5. Deploy the image to AWS EC2 through SSH
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG
          script: |
            set -eu

            IMAGE="$DOCKER_USERNAME/mep-apis:$IMAGE_TAG"
            CONTAINER_NAME="mep-apis"

            echo "Logging in to Docker Hub..."
            echo "$DOCKERHUB_PASSWORD" | docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            docker logout

            echo "Stopping existing container if it exists..."
            if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              docker stop "$CONTAINER_NAME"
              docker rm "$CONTAINER_NAME"
            fi

            echo "Starting updated container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"

            echo "Removing unused Docker images..."
            docker image prune -f

            echo "Deployment completed."
