
name: DRMep .NET 8 API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'mep-apis/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mep-apis-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: mep-apis
  CONTAINER_NAME: mep-apis

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build and push the .NET 8 API image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./mep-apis
          file: ./mep-apis/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mep-apis:latest
            ${{ secrets.DOCKER_USERNAME }}/mep-apis:${{ github.sha }}

      # 5. Deploy to the existing AWS EC2 server
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/mep-apis:${{ github.sha }}
          CONTAINER: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER
          script: |
            set -eu

            echo "Pulling Docker image..."
            docker pull "$IMAGE"

            echo "Removing previous container..."
            docker rm -f "$CONTAINER" 2>/dev/null || true

            echo "Starting DRMep API..."
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 5001:8080 \
              "$IMAGE"

            echo "Checking container status..."
            sleep 5
            docker ps --filter "name=$CONTAINER"

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "Container failed to start. Recent logs:"
              docker logs --tail 100 "$CONTAINER" || true
              exit 1
            fi

            echo "Deployment completed successfully."
