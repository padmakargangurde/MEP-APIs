name: Build and Deploy .NET 8 API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mep-apis-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify repository structure
      - name: Verify Dockerfile and solution
        run: |
          echo "Repository root:"
          pwd
          ls -la

          test -f Dockerfile || {
            echo "ERROR: Dockerfile not found in repository root"
            find . -type f -iname 'Dockerfile'
            exit 1
          }

          test -f MEP-APIs.sln || {
            echo "ERROR: MEP-APIs.sln not found in repository root"
            exit 1
          }

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build and push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mep-apis:latest
            ${{ secrets.DOCKER_USERNAME }}/mep-apis:${{ github.sha }}

      # 6. Deploy to EC2 via SSH
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG
          script: |
            set -eu

            IMAGE="$DOCKER_USERNAME/mep-apis:$IMAGE_TAG"
            CONTAINER_NAME="mep-apis"

            echo "Logging in to Docker Hub..."
            echo "$DOCKER_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            docker logout

            echo "Stopping existing container if present..."
            if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
              docker stop "$CONTAINER_NAME"
              docker rm "$CONTAINER_NAME"
            fi

            echo "Starting updated application..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE"

            echo "Checking container status..."
            sleep 5
            docker ps --filter "name=^/${CONTAINER_NAME}$"

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              echo "ERROR: Application container failed to start"
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            echo "Cleaning up unused images..."
            docker image prune -f

            echo "Deployment completed successfully."
