name: MEP-APIs-DotNet8-CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: mep-apis
  DOTNET_VERSION: '8.0.x'

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Setup .NET 8
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restore NuGet packages
      - name: Restore Dependencies
        run: dotnet restore ./MEP-APIs/MEP-APIs.sln

      # 4. Build solution
      - name: Build Solution
        run: dotnet build ./MEP-APIs/MEP-APIs.sln --configuration Release --no-restore

      # 5. Run tests
      - name: Run Tests
        run: dotnet test /MEP-APIs/MEP-APIs.sln --configuration Release --no-build

      # 6. Login to Docker Hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            .

      # 8. Push image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 9. Deploy to AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            IMAGE="${{ secrets.DOCKER_USERNAME }}/mep-apis:latest"
            CONTAINER="mep-apis"

            echo "Pulling latest Docker image..."
            docker pull "$IMAGE"

            echo "Removing old container..."
            docker rm -f "$CONTAINER" 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 4444:8080 \
              "$IMAGE"

            echo "Checking container status..."
            docker ps --filter "name=$CONTAINER"

            echo "Deployment completed."
